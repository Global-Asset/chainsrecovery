services:
  - type: web
      name: chainsrecovery
          runtime: node
              rootDir: backend
                  plan: free
                      buildCommand: npm install
                          startCommand: npm start
                              envVars:
                                    - key: NODE_ENV
                                            value: production
                                                  - key: JWT_SECRET
                                                          generateValue: true
                                                                - key: ADMIN_EMAIL
                                                                        sync: false
                                                                              - key: ADMIN_PASSWORD
                                                                                      sync: false
                                                                                            - key: TURSO_DATABASE_URL
                                                                                                    sync: false
                                                                                                          - key: TURSO_AUTH_TOKEN
                                                                                                                  sync: false