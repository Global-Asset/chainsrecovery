services:
  - type: web
    name: chainsrecovery
    runtime: node
    rootDir: backend
    plan: free
    # Changed from npm ci to npm install to prevent lockfile errors
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    domains:
      - efikcoin.xyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # --- ADDED TURSO VARIABLES HERE ---
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # ----------------------------------
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
