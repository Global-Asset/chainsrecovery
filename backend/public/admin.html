<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChainRecover — Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #03050a; color: #e9eefb; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  .hidden { display: none !important; }
  input, button, select { font: inherit; outline: none; }
  
  /* LOGIN */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 0%, rgba(0,229,160,0.05), transparent 50%); }
  .login-box { background: #0b1322; padding: 40px 30px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #1a2a3a; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
  .login-box h2 { margin-top: 0; color: #00e5a0; }
  .login-box input { width: 100%; padding: 14px; border-radius: 10px; background: #05070e; border: 1px solid #1a2a3a; margin-bottom: 16px; color: white; }
  .login-box input:focus { border-color: #00e5a0; }
  .login-box button { width: 100%; padding: 14px; border-radius: 10px; font-weight: 700; background: #00e5a0; color: #03130d; border: none; cursor: pointer; transition: 0.2s; }
  .login-box button:hover { background: #00c78b; transform: translateY(-2px); }

  /* TOP BAR */
  .top-bar { background: rgba(11, 19, 34, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #1a2a3a; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
  .top-bar h1 { font-size: 1.1rem; color: #fff; margin: 0; display: flex; align-items: center; gap: 8px; }
  .top-bar h1 span { color: #00e5a0; }
  .btn-logout { background: rgba(255,107,129,0.1); color: #ff6b81; border: 1px solid rgba(255,107,129,0.3); padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
  .btn-logout:hover { background: rgba(255,107,129,0.2); }

  /* MAIN CONTENT */
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .header-row { display: flex; justify-content: space-between; align-items: center; margin: 30px 0 15px; flex-wrap: wrap; gap: 15px; }
  .section-title { font-size: 1.1rem; color: #fff; margin: 0; font-weight: 700; }
  .search-bar { padding: 10px 16px; border-radius: 10px; background: #0b1322; border: 1px solid #1a2a3a; color: #fff; width: 100%; max-width: 300px; transition: 0.2s; }
  .search-bar:focus { border-color: #00e5a0; box-shadow: 0 0 0 3px rgba(0,229,160,0.1); }
  
  /* TABLES */
  .table-card { background: #0b1322; border: 1px solid #1a2a3a; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  .tbl-wrap { overflow-x: auto; max-height: 500px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 700px; }
  th { text-align: left; padding: 14px 16px; font-size: 0.75rem; color: #93a1b8; text-transform: uppercase; background: #05070e; border-bottom: 1px solid #1a2a3a; position: sticky; top: 0; z-index: 1; }
  td { padding: 14px 16px; border-bottom: 1px solid #1a2a3a; vertical-align: middle; }
  tr:hover td { background: rgba(255,255,255,0.02); }

  /* PILLS & BUTTONS */
  .pill { padding: 4px 10px; border-radius: 99px; font-size: 0.7rem; font-weight: 800; display: inline-block; text-transform: uppercase; }
  .pill.Active, .pill.Approved { background: rgba(0,229,160,0.15); color: #00e5a0; }
  .pill.Suspended, .pill.Declined { background: rgba(255,107,129,0.15); color: #ff6b81; }
  .pill.Pending { background: rgba(255,200,87,0.15); color: #ffc857; }
  
  .btn-manage { background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.75rem; transition: 0.2s; }
  .btn-manage:hover { background: #2563eb; }
  .btn-action { padding: 4px 10px; border-radius: 6px; font-weight: 600; font-size: 0.75rem; cursor: pointer; border: none; margin-right: 4px; transition: 0.2s; }
  .btn-approve { background: #00e5a0; color: #03130d; }
  .btn-decline { background: #ff6b81; color: #fff; }

  /* DRAWER (SIDEBAR) */
  .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: none; z-index: 50; opacity: 0; transition: opacity 0.3s; }
  .drawer-overlay.open { display: block; opacity: 1; }
  .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 100%; max-width: 500px; background: #0b1322; border-left: 1px solid #1a2a3a; overflow-y: auto; box-shadow: -10px 0 30px rgba(0,0,0,0.5); transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; }
  .drawer-overlay.open .drawer { transform: translateX(0); }
  
  .d-head { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #1a2a3a; background: #0b1322; position: sticky; top: 0; z-index: 2; }
  .d-body { padding: 24px; flex: 1; }
  .info-row { margin-bottom: 14px; display: flex; justify-content: space-between; border-bottom: 1px dashed #1a2a3a; padding-bottom: 8px; }
  .info-row label { font-size: 0.75rem; color: #93a1b8; text-transform: uppercase; font-weight: 600; }
  .info-row .val { font-size: 0.9rem; font-weight: 600; text-align: right; }
  .info-row .val.mono { font-family: monospace; font-size: 0.8rem; color: #00e5a0; word-break: break-all; max-width: 60%; }
  
  .btn-lock { width: 100%; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; border: none; margin-top: 10px; transition: 0.2s; }
  
  .bal-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 15px; }
  .bal-box { background: #05070e; border: 1px solid #1a2a3a; padding: 10px 12px; border-radius: 8px; }
  .bal-box span { font-size: 0.7rem; color: #93a1b8; font-weight: 700; }
  .bal-box input { width: 100%; background: transparent; border: none; color: #00e5a0; font-size: 1rem; font-weight: 700; margin-top: 4px; }
  .bal-box input:focus { color: #fff; }
  
  .btn-save { width: 100%; padding: 14px; border-radius: 10px; font-weight: 700; background: #00e5a0; color: #03130d; cursor: pointer; border: none; margin-top: 20px; font-size: 1rem; transition: 0.2s; }
  .btn-save:hover { background: #00c78b; }
  
  .btn-danger { width: 100%; padding: 14px; border-radius: 10px; font-weight: 700; background: rgba(255,107,129,0.1); color: #ff6b81; border: 1px solid rgba(255,107,129,0.3); cursor: pointer; margin-top: 12px; transition: 0.2s; }
  .btn-danger:hover { background: rgba(255,107,129,0.2); }

  @media (max-width: 600px) {
    .bal-grid { grid-template-columns: 1fr 1fr; }
    .header-row { flex-direction: column; align-items: stretch; }
    .search-bar { max-width: 100%; }
  }
</style>
</head>
<body>

  <!-- LOGIN VIEW -->
  <div id="loginView" class="login">
    <div class="login-box">
      <h2>Admin Access</h2>
      <p style="color:#93a1b8; font-size:0.9rem; margin-bottom:20px;">Enter your secure password to continue.</p>
      <input type="password" id="adminPass" placeholder="Admin Password">
      <button onclick="login()">Unlock Dashboard</button>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashView" class="hidden">
    <div class="top-bar">
      <h1>ChainRecover <span>Admin</span></h1>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>
    
    <div class="wrap">
      <!-- WITHDRAWALS SECTION -->
      <div class="header-row">
        <h2 class="section-title">Pending Withdrawals</h2>
      </div>
      <div class="table-card">
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>User</th><th>Coin</th><th>Amount</th><th>Destination Address</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="withdrawTable"></tbody>
          </table>
        </div>
      </div>

      <!-- USERS SECTION -->
      <div class="header-row">
        <h2 class="section-title">Registered Users</h2>
        <input type="text" id="userSearch" class="search-bar" placeholder="🔍 Search by name or email..." onkeyup="renderUsers()">
      </div>
      <div class="table-card">
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>Name</th><th>Email</th><th>Total USD</th><th>Status</th><th>Manage</th></tr></thead>
            <tbody id="userTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- DRAWER (USER DETAILS) -->
  <div class="drawer-overlay" id="drawer" onclick="closeDrawer(event)">
    <div class="drawer" onclick="event.stopPropagation()">
      <div class="d-head">
        <h2 id="dName" style="margin:0;color:#fff;font-size:1.2rem;">User</h2>
        <button onclick="closeDrawer()" style="background:rgba(255,255,255,0.05); color:#fff; border:none; padding:8px 12px; border-radius:8px; cursor:pointer;">✕ Close</button>
      </div>
      
      <div class="d-body">
        <div class="info-row"><label>Email</label><div class="val" id="dEmail"></div></div>
        <div class="info-row"><label>Phone</label><div class="val" id="dPhone"></div></div>
        <div class="info-row"><label>Country</label><div class="val" id="dCountry"></div></div>
        <div class="info-row"><label>Address</label><div class="val" id="dAddress"></div></div>
        <div class="info-row"><label>Wallet</label><div class="val mono" id="dWallet"></div></div>
        
        <div class="info-row" style="margin-top: 25px; border:none; align-items: center;">
          <label style="font-size:0.9rem; color:#fff;">Status:</label>
          <span id="dStatusPill" class="pill Active">Active</span>
        </div>
        
        <button id="lockBtn" class="btn-lock" onclick="toggleLock()">Suspend Account</button>
        <button class="btn-danger" onclick="deleteUser()">Delete Account Permanently</button>

        <div style="height:1px; background:#1a2a3a; margin:30px 0;"></div>

        <label style="font-size:1rem; font-weight:700; color:#00e5a0;">Edit Wallet Balances</label>
        <p style="font-size:0.8rem; color:#93a1b8; margin:5px 0 15px;">Type new amounts below. Changes are logged automatically.</p>
        
        <div class="bal-grid" id="balGrid"></div>
        
        <input type="text" id="adjustNote" placeholder="Reason for adjustment (e.g., Deposit, Bonus)" style="width:100%; padding:14px; background:#05070e; border:1px solid #1a2a3a; border-radius:8px; color:white; margin-top:15px;">
        <button class="btn-save" onclick="saveBalances()">Save Balance Changes</button>
      </div>
    </div>
  </div>

  <script>
    // --- API WRAPPER ---
    // This ensures the admin panel works even if your api.js is missing or different.
    const API_BASE = ''; 
    async function api(path, options = {}) {
      const headers = { 'Content-Type': 'application/json' };
      if (options.auth === 'admin') {
        headers['Authorization'] = 'Bearer ' + localStorage.getItem('cr_admin_token');
      }
      const res = await fetch(API_BASE + path, {
        method: options.method || 'GET',
        headers,
        body: options.body ? JSON.stringify(options.body) : undefined
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong');
      return data;
    }
    
    // --- TOKENS ---
    const Tokens = {
      setAdmin: (t) => localStorage.setItem('cr_admin_token', t),
      getAdmin: () => localStorage.getItem('cr_admin_token'),
      clearAdmin: () => localStorage.removeItem('cr_admin_token')
    };

    // --- STATE ---
    let allUsers = [];
    let currentUser = null;
    const prices = { BNB: 580, BTC: 67000, ETH: 3400, MATIC: 0.7, ECE: 1, USDT: 1, USDC: 1, SOL: 145, TRX: 0.13 };
    const COINS = ['BNB','BTC','ETH','MATIC','ECE','USDT','USDC','SOL','TRX'];

    // --- LOGIN ---
    async function login() {
      try {
        const data = await api('/api/admin/login', { method: 'POST', body: { password: document.getElementById('adminPass').value } });
        Tokens.setAdmin(data.token);
        loadDash();
      } catch (err) { alert(err.message); }
    }

    async function loadDash() {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('dashView').classList.remove('hidden');
      await loadUsers(); 
      loadWithdrawals();
    }

    // --- LOAD USERS ---
    async function loadUsers() {
      try {
        const data = await api('/api/admin/users', { auth: 'admin' });
        allUsers = data.users;
        renderUsers();
      } catch (err) { alert('Session expired. Please log in again.'); logout(); }
    }

    // --- RENDER USERS (With Search Filter) ---
    function renderUsers() {
      const query = document.getElementById('userSearch').value.toLowerCase();
      let html = '';
      
      const filtered = allUsers.filter(u => 
        (u.name && u.name.toLowerCase().includes(query)) || 
        (u.email && u.email.toLowerCase().includes(query)) ||
        (u.wallet_address && u.wallet_address.toLowerCase().includes(query))
      );

      if (filtered.length === 0) {
        html = '<tr><td colspan="5" style="text-align:center; color:#93a1b8; padding:30px;">No users found matching your search.</td></tr>';
      }

      filtered.forEach(u => {
        let totalUsd = 0;
        for (const [coin, amt] of Object.entries(u.balances)) {
          totalUsd += amt * (prices[coin] || 0);
        }
        const status = u.locked ? '<span class="pill Suspended">Suspended</span>' : '<span class="pill Active">Active</span>';
        html += `<tr>
          <td><b>${u.name}</b></td>
          <td>${u.email}</td>
          <td style="color:#00e5a0; font-weight:bold;">$${totalUsd.toFixed(2)}</td>
          <td>${status}</td>
          <td><button class="btn-manage" onclick="openDrawer(${u.id})">Manage / Edit</button></td>
        </tr>`;
      });
      document.getElementById('userTable').innerHTML = html;
    }

    // --- LOAD WITHDRAWALS ---
    async function loadWithdrawals() {
      try {
        const data = await api('/api/admin/withdrawals', { auth: 'admin' });
        let html = '';
        
        if(data.withdrawals.length === 0) {
          html = '<tr><td colspan="6" style="text-align:center; color:#93a1b8; padding:30px;">No withdrawal requests found.</td></tr>';
        }

        data.withdrawals.forEach(w => {
          const user = allUsers.find(u => u.id === w.user_id);
          const uname = user ? `${user.name} <br><small style="color:#93a1b8;">${user.email}</small>` : 'User #' + w.user_id;
          const destAddress = w.address || (user ? user.wallet_address : 'N/A');
          
          let actionHtml = '';
          if (w.status === 'Pending') {
            actionHtml = `<button class="btn-action btn-approve" onclick="processW(${w.id}, 'approve')">Approve</button>
                          <button class="btn-action btn-decline" onclick="processW(${w.id}, 'decline')">Decline</button>`;
          } else {
            actionHtml = `<span style="color:#93a1b8; font-size:0.75rem;">Processed</span>`;
          }

          const pillClass = w.status === 'Pending' ? 'Pending' : (w.status === 'Approved' ? 'Approved' : 'Declined');

          html += `<tr>
            <td>${uname}</td>
            <td><b>${w.coin}</b></td>
            <td style="color:#ffc857; font-weight:bold;">${w.amount}</td>
            <td style="font-family:monospace; font-size:0.75rem; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${destAddress}">${destAddress}</td>
            <td><span class="pill ${pillClass}">${w.status}</span></td>
            <td>${actionHtml}</td>
          </tr>`;
        });
        document.getElementById('withdrawTable').innerHTML = html;
      } catch (err) { console.error(err); }
    }

    // --- PROCESS WITHDRAWAL ---
    async function processW(id, action) {
      if(!confirm(`Are you sure you want to ${action} this withdrawal?`)) return;
      try {
        await api(`/api/admin/withdrawals/${id}`, { method: 'PATCH', auth: 'admin', body: { action } });
        alert('Withdrawal ' + action + 'd successfully.');
        loadWithdrawals(); 
        loadUsers();
      } catch (err) { alert(err.message); }
    }

    // --- OPEN DRAWER ---
    function openDrawer(id) {
      currentUser = allUsers.find(u => u.id === id);
      document.getElementById('dName').innerText = currentUser.name;
      document.getElementById('dEmail').innerText = currentUser.email;
      document.getElementById('dPhone').innerText = currentUser.phone || '-';
      document.getElementById('dCountry').innerText = currentUser.country || '-';
      document.getElementById('dAddress').innerText = currentUser.address || '-';
      document.getElementById('dWallet').innerText = currentUser.wallet_address;
      
      const pill = document.getElementById('dStatusPill');
      const btn = document.getElementById('lockBtn');
      
      if (currentUser.locked) {
        pill.className = 'pill Suspended'; pill.innerText = 'Suspended';
        btn.innerText = 'Activate Account'; btn.style.background = '#00e5a0'; btn.style.color = '#03130d';
      } else {
        pill.className = 'pill Active'; pill.innerText = 'Active';
        btn.innerText = 'Suspend Account'; btn.style.background = '#ff6b81'; btn.style.color = 'white';
      }

      let bHtml = '';
      COINS.forEach(c => {
        bHtml += `<div class="bal-box"><span>${c}</span><input type="number" id="bal_${c}" value="${currentUser.balances[c] || 0}" step="any"></div>`;
      });
      document.getElementById('balGrid').innerHTML = bHtml;
      document.getElementById('adjustNote').value = ''; // Clear note
      document.getElementById('drawer').classList.add('open');
    }

    // --- CLOSE DRAWER ---
    function closeDrawer(e) {
      if (e && e.target !== document.getElementById('drawer')) return;
      document.getElementById('drawer').classList.remove('open');
      currentUser = null;
    }

    // --- SUSPEND / BAN ---
    async function toggleLock() {
      const isLocking = !currentUser.locked;
      const reason = isLocking ? prompt("Reason for suspension (optional):") : "";
      if (isLocking && reason === null) return; // User cancelled prompt
      
      try {
        await api(`/api/admin/users/${currentUser.id}/lock`, { method: 'PATCH', auth: 'admin', body: { locked: isLocking, reason } });
        loadUsers(); 
        closeDrawer();
      } catch (err) { alert(err.message); }
    }

    // --- DELETE USER ---
    async function deleteUser() {
      const confirmText = prompt(`This will PERMANENTLY delete ${currentUser.name} and all their data.\n\nType "DELETE" to confirm:`);
      if (confirmText !== 'DELETE') {
        if(confirmText !== null) alert('Deletion cancelled. You must type DELETE exactly.');
        return;
      }
      
      try {
        await api(`/api/admin/users/${currentUser.id}`, { method: 'DELETE', auth: 'admin' });
        alert('User account deleted permanently.');
        loadUsers();
        closeDrawer();
      } catch (err) { alert(err.message); }
    }

    // --- SAVE BALANCES ---
    async function saveBalances() {
      const newBals = {};
      COINS.forEach(c => { 
        newBals[c] = parseFloat(document.getElementById(`bal_${c}`).value) || 0; 
      });
      
      const note = document.getElementById('adjustNote').value || 'Admin Balance Adjustment';

      try {
        await api(`/api/admin/users/${currentUser.id}/balances`, { 
          method: 'PATCH', 
          auth: 'admin', 
          body: { balances: newBals, note } 
        });
        alert('Balances saved and user history updated!'); 
        loadUsers(); 
        closeDrawer();
      } catch (err) { alert(err.message); }
    }

    // --- LOGOUT ---
    function logout() { 
      Tokens.clearAdmin(); 
      location.reload(); 
    }

    // Check if already logged in
    if (Tokens.getAdmin()) {
      loadDash();
    }
  </script>
</body>
</html>
