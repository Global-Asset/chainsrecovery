<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChainRecover — Admin</title>
<style>
  body { font-family: system-ui; background: #05070e; color: #e9eefb; margin: 0; padding: 0; }
  .hidden { display: none !important; }
  input, button { font: inherit; outline: none; }
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-box { background: #0b1322; padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #1a2a3a; }
  .login-box input { width: 100%; padding: 13px; border-radius: 11px; background: #05070e; border: 1px solid #1a2a3a; margin-bottom: 14px; color: white; box-sizing: border-box; }
  .login-box button { width: 100%; padding: 13px; border-radius: 11px; font-weight: bold; background: #00e5a0; color: #03130d; border: none; cursor: pointer; }
  .top-bar { background: #0b1322; border-bottom: 1px solid #1a2a3a; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
  .top-bar h1 { font-size: 1.1rem; color: #00e5a0; margin: 0; }
  .btn-logout { background: rgba(255,107,129,0.15); color: #ff6b81; border: 1px solid rgba(255,107,129,0.3); padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 20px; }
  .section-title { font-size: 1rem; color: #fff; margin: 24px 0 12px; font-weight: bold; }
  .table-card { background: #0b1322; border: 1px solid #1a2a3a; border-radius: 14px; overflow: hidden; }
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 600px; }
  th { text-align: left; padding: 14px 16px; font-size: 0.7rem; color: #93a1b8; text-transform: uppercase; background: #05070e; border-bottom: 1px solid #1a2a3a; }
  td { padding: 14px 16px; border-bottom: 1px solid #1a2a3a; vertical-align: middle; }
  .pill { padding: 4px 10px; border-radius: 99px; font-size: 0.7rem; font-weight: 800; display: inline-block; }
  .pill.Active { background: rgba(0,229,160,0.15); color: #00e5a0; }
  .pill.Suspended { background: rgba(255,107,129,0.15); color: #ff6b81; }
  .pill.Pending { background: rgba(255,200,87,0.15); color: #ffc857; }
  .pill.Approved { background: rgba(0,229,160,0.15); color: #00e5a0; }
  .pill.Declined { background: rgba(255,107,129,0.15); color: #ff6b81; }
  .btn-manage { background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.75rem; }
  
  .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; z-index: 50; }
  .drawer-overlay.open { display: block; }
  .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 100%; max-width: 450px; background: #0b1322; border-left: 2px solid #00e5a0; overflow-y: auto; animation: slide .3s ease-out; }
  @keyframes slide { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .d-head { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #1a2a3a; position: sticky; top: 0; background: #0b1322; z-index: 2; }
  .d-body { padding: 20px; }
  .info-row { margin-bottom: 12px; }
  .info-row label { display: block; font-size: 0.7rem; color: #93a1b8; text-transform: uppercase; }
  .info-row .val { font-size: 0.9rem; font-weight: bold; }
  .info-row .val.mono { font-family: monospace; font-size: 0.75rem; color: #00e5a0; word-break: break-all; }
  .btn-lock { width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; margin-top: 10px; }
  .bal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
  .bal-box { background: #05070e; border: 1px solid #1a2a3a; padding: 10px; border-radius: 8px; }
  .bal-box span { font-size: 0.7rem; color: #93a1b8; font-weight: bold; }
  .bal-box input { width: 100%; background: transparent; border: none; color: #00e5a0; font-size: 1rem; font-weight: bold; margin-top: 4px; }
  .btn-save { width: 100%; padding: 14px; border-radius: 10px; font-weight: bold; background: #00e5a0; color: #03130d; cursor: pointer; border: none; margin-top: 20px; }
</style>
</head>
<body>

  <div id="loginView" class="login">
    <div class="login-box">
      <h2>Admin Access</h2>
      <input type="password" id="adminPass" placeholder="Admin Password">
      <button onclick="login()">Unlock</button>
    </div>
  </div>

  <div id="dashView" class="hidden">
    <div class="top-bar">
      <h1>Admin Control Panel</h1>
      <button class="btn-logout" onclick="logout()">Lock</button>
    </div>
    <div class="wrap">
      <div class="section-title">Withdrawals</div>
      <div class="table-card">
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>User</th><th>Coin</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="withdrawTable"></tbody>
          </table>
        </div>
      </div>

      <div class="section-title">Registered Users</div>
      <div class="table-card">
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>Name</th><th>Email</th><th>Total USD</th><th>Status</th><th>Manage</th></tr></thead>
            <tbody id="userTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- DRAWER -->
  <div class="drawer-overlay" id="drawer" onclick="closeDrawer(event)">
    <div class="drawer" onclick="event.stopPropagation()">
      <div class="d-head">
        <h2 id="dName" style="margin:0;color:#00e5a0;font-size:1.1rem;">User</h2>
        <button onclick="closeDrawer()" style="background:#ff6b81;color:white;border:none;padding:5px 10px;border-radius:6px;">Close</button>
      </div>
      <div class="d-body">
        <div class="info-row"><label>Email</label><div class="val" id="dEmail"></div></div>
        <div class="info-row"><label>Phone</label><div class="val" id="dPhone"></div></div>
        <div class="info-row"><label>Country</label><div class="val" id="dCountry"></div></div>
        <div class="info-row"><label>Address</label><div class="val" id="dAddress"></div></div>
        <div class="info-row"><label>Wallet Address</label><div class="val mono" id="dWallet"></div></div>
        
        <div class="info-row" style="margin-top: 20px;">
          <label>Account Status</label>
          <span id="dStatusPill" class="pill Active">Active</span>
          <button id="lockBtn" class="btn-lock" onclick="toggleLock()">Suspend</button>
        </div>

        <div style="height:1px; background:#1a2a3a; margin:20px 0;"></div>

        <label style="font-size:0.9rem; font-weight:bold; color:#00e5a0;">Write Balances (Editor)</label>
        <div class="bal-grid" id="balGrid"></div>
        <input type="text" id="adjustNote" placeholder="Reason for adjustment" style="width:100%; padding:12px; background:#05070e; border:1px solid #1a2a3a; border-radius:8px; color:white; margin-top:10px;">
        <button class="btn-save" onclick="saveBalances()">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    let allUsers = [];
    let currentUser = null;
    const prices = { BNB: 580, BTC: 67000, ETH: 3400, MATIC: 0.7, ECE: 1, USDT: 1, USDC: 1, SOL: 145, TRX: 0.13 };

    async function login() {
      try {
        const data = await api('/api/admin/login', { method: 'POST', body: { password: document.getElementById('adminPass').value } });
        Tokens.setAdmin(data.token);
        loadDash();
      } catch (err) { alert(err.message); }
    }

    async function loadDash() {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('dashView').classList.remove('hidden');
      await loadUsers(); 
      loadWithdrawals();
    }

    async function loadUsers() {
      try {
        const data = await api('/api/admin/users', { auth: 'admin' });
        allUsers = data.users;
        let html = '';
        allUsers.forEach(u => {
          let totalUsd = 0;
          for (const [coin, amt] of Object.entries(u.balances)) {
            totalUsd += amt * (prices[coin] || 0);
          }
          const status = u.locked ? '<span class="pill Suspended">Suspended</span>' : '<span class="pill Active">Active</span>';
          html += `<tr>
            <td><b>${u.name}</b></td>
            <td>${u.email}</td>
            <td style="color:#00e5a0; font-weight:bold;">$${totalUsd.toFixed(2)}</td>
            <td>${status}</td>
            <td><button class="btn-manage" onclick="openDrawer(${u.id})">Manage / Edit</button></td>
          </tr>`;
        });
        document.getElementById('userTable').innerHTML = html;
      } catch (err) { alert('Session expired'); logout(); }
    }

    async function loadWithdrawals() {
      try {
        const data = await api('/api/admin/withdrawals', { auth: 'admin' });
        let html = '';
        data.withdrawals.forEach(w => {
          const user = allUsers.find(u => u.id === w.user_id);
          const uname = user ? user.name : 'User #' + w.user_id;
          
          let actionHtml = '';
          if (w.status === 'Pending') {
            actionHtml = `<button onclick="processW(${w.id}, 'approve')" style="background:#00e5a0;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-weight:bold;font-size:0.7rem;">Approve</button>
                          <button onclick="processW(${w.id}, 'decline')" style="background:#ff6b81;color:white;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-weight:bold;font-size:0.7rem;">Decline</button>`;
          }

          const pillClass = w.status === 'Pending' ? 'Pending' : (w.status === 'Approved' ? 'Approved' : 'Declined');

          html += `<tr>
            <td>${uname}</td>
            <td>${w.coin}</td>
            <td><b>${w.amount}</b></td>
            <td><span class="pill ${pillClass}">${w.status}</span></td>
            <td>${actionHtml}</td>
          </tr>`;
        });
        if(data.withdrawals.length === 0) html = '<tr><td colspan="5" style="text-align:center;">No withdrawals yet.</td></tr>';
        document.getElementById('withdrawTable').innerHTML = html;
      } catch (err) {}
    }

    async function processW(id, action) {
      try {
        await api(`/api/admin/withdrawals/${id}`, { method: 'PATCH', auth: 'admin', body: { action } });
        alert('Withdrawal ' + action + 'd!');
        loadWithdrawals(); loadUsers();
      } catch (err) { alert(err.message); }
    }

    function openDrawer(id) {
      currentUser = allUsers.find(u => u.id === id);
      document.getElementById('dName').innerText = currentUser.name;
      document.getElementById('dEmail').innerText = currentUser.email;
      document.getElementById('dPhone').innerText = currentUser.phone || '-';
      document.getElementById('dCountry').innerText = currentUser.country || '-';
      document.getElementById('dAddress').innerText = currentUser.address || '-';
      document.getElementById('dWallet').innerText = currentUser.wallet_address;
      
      const pill = document.getElementById('dStatusPill');
      const btn = document.getElementById('lockBtn');
      if (currentUser.locked) {
        pill.className = 'pill Suspended'; pill.innerText = 'Suspended';
        btn.innerText = 'Activate Account'; btn.style.background = '#00e5a0'; btn.style.color = '#03130d';
      } else {
        pill.className = 'pill Active'; pill.innerText = 'Active';
        btn.innerText = 'Suspend Account'; btn.style.background = '#ff6b81'; btn.style.color = 'white';
      }

      const coins = ['BNB','BTC','ETH','MATIC','ECE','USDT','USDC','SOL','TRX'];
      let bHtml = '';
      coins.forEach(c => {
        bHtml += `<div class="bal-box"><span>${c}</span><input type="number" id="bal_${c}" value="${currentUser.balances[c] || 0}" step="any"></div>`;
      });
      document.getElementById('balGrid').innerHTML = bHtml;
      document.getElementById('drawer').classList.add('open');
    }

    function closeDrawer(e) {
      if (e && e.target !== document.getElementById('drawer')) return;
      document.getElementById('drawer').classList.remove('open');
    }

    async function toggleLock() {
      const isLocking = !currentUser.locked;
      const reason = isLocking ? prompt("Reason for suspension:") : "";
      if (isLocking && reason === null) return;
      try {
        await api(`/api/admin/users/${currentUser.id}/lock`, { method: 'PATCH', auth: 'admin', body: { locked: isLocking, reason } });
        loadUsers(); closeDrawer();
      } catch (err) { alert(err.message); }
    }

    async function saveBalances() {
      const coins = ['BNB','BTC','ETH','MATIC','ECE','USDT','USDC','SOL','TRX'];
      const newBals = {};
      coins.forEach(c => { newBals[c] = parseFloat(document.getElementById(`bal_${c}`).value) || 0; });
      const note = document.getElementById('adjustNote').value;

      try {
        await api(`/api/admin/users/${currentUser.id}/balances`, { method: 'PATCH', auth: 'admin', body: { balances: newBals, note } });
        alert('Balances Saved!'); loadUsers(); closeDrawer();
      } catch (err) { alert(err.message); }
    }

    function logout() { Tokens.clearAdmin(); location.reload(); }
    if (Tokens.getAdmin()) loadDash();
  </script>
</body>
</html>
