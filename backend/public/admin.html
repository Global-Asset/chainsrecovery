<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChainRecover — Admin Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05070e; color: #e9eefb; line-height: 1.5; }
  .hidden { display: none !important; }
  input, button { font: inherit; outline: none; }
  
  /* LOGIN */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 0%, rgba(0,229,160,.12), transparent 60%); }
  .login-box { width: 100%; max-width: 400px; background: #0b1322; border: 1px solid #1a2a3a; border-radius: 20px; padding: 36px 30px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
  .login-box h1 { font-size: 1.4rem; margin-bottom: 8px; color: #00e5a0; }
  .login-box p { font-size: 0.85rem; color: #93a1b8; margin-bottom: 24px; }
  .login-box input { width: 100%; padding: 14px; border-radius: 10px; background: #05070e; border: 1px solid #1a2a3a; margin-bottom: 16px; text-align: center; color: white; }
  .login-box button { width: 100%; padding: 14px; border-radius: 10px; font-weight: 800; color: #03130d; background: #00e5a0; cursor: pointer; border: none; }

  /* DASHBOARD */
  .top-bar { background: #0b1322; border-bottom: 1px solid #1a2a3a; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
  .top-bar h1 { font-size: 1.1rem; color: #00e5a0; margin: 0; }
  .btn-logout { background: rgba(255,107,129,0.15); color: #ff6b81; border: 1px solid rgba(255,107,129,0.3); padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  
  .wrap { max-width: 1000px; margin: 0 auto; padding: 20px; }
  .section-title { font-size: 1rem; color: #fff; margin: 24px 0 12px; font-weight: bold; }
  
  /* TABLES */
  .table-card { background: #0b1322; border: 1px solid #1a2a3a; border-radius: 14px; overflow: hidden; }
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th { text-align: left; padding: 14px 16px; font-size: 0.75rem; color: #93a1b8; text-transform: uppercase; background: #05070e; border-bottom: 1px solid #1a2a3a; }
  td { padding: 16px; border-bottom: 1px solid #1a2a3a; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  
  /* STATUS PILLS */
  .pill { padding: 4px 10px; border-radius: 99px; font-size: 0.75rem; font-weight: 800; display: inline-block; }
  .pill.Active { background: rgba(0,229,160,0.15); color: #00e5a0; border: 1px solid rgba(0,229,160,0.3); }
  .pill.Suspended { background: rgba(255,107,129,0.15); color: #ff6b81; border: 1px solid rgba(255,107,129,0.3); }
  .pill.Pending { background: rgba(255,200,87,0.15); color: #ffc857; border: 1px solid rgba(255,200,87,0.3); }

  /* MANAGE BUTTON */
  .btn-manage { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; white-space: nowrap; }
  .btn-manage:hover { background: #2563eb; }

  /* DRAWER (Side Panel) */
  .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: none; z-index: 50; }
  .drawer-overlay.open { display: block; }
  .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 100%; max-width: 480px; background: #0b1322; border-left: 2px solid #00e5a0; overflow-y: auto; animation: slide .3s ease-out; box-shadow: -10px 0 30px rgba(0,0,0,0.5); }
  @keyframes slide { from { transform: translateX(100%); } to { transform: translateX(0); } }
  
  .d-head { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #1a2a3a; position: sticky; top: 0; background: #0b1322; z-index: 2; }
  .d-head h2 { font-size: 1.2rem; color: #00e5a0; margin: 0; }
  .btn-close { background: rgba(255,255,255,0.1); color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
  
  .d-body { padding: 20px; }
  .info-row { margin-bottom: 16px; }
  .info-row label { display: block; font-size: 0.75rem; color: #93a1b8; text-transform: uppercase; margin-bottom: 4px; }
  .info-row .val { font-size: 0.95rem; font-weight: bold; }
  .info-row .val.mono { font-family: monospace; font-size: 0.8rem; color: #00e5a0; word-break: break-all; }

  .divider { height: 1px; background: #1a2a3a; margin: 24px 0; }

  /* LOCK BUTTON */
  .btn-lock { width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; margin-top: 10px; }
  .btn-lock.suspend { background: #ff6b81; color: white; }
  .btn-lock.activate { background: #00e5a0; color: #03130d; }

  /* BALANCES GRID */
  .bal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .bal-box { background: #05070e; border: 1px solid #1a2a3a; padding: 12px; border-radius: 10px; }
  .bal-box span { font-size: 0.75rem; color: #93a1b8; font-weight: bold; text-transform: uppercase; }
  .bal-box input { width: 100%; background: transparent; border: none; color: #00e5a0; font-size: 1.1rem; font-weight: bold; font-family: monospace; margin-top: 4px; }
  
  .btn-save { width: 100%; padding: 14px; border-radius: 10px; font-weight: 800; color: #03130d; background: #00e5a0; cursor: pointer; border: none; margin-top: 20px; }
</style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginView" class="login">
    <div class="login-box">
      <h1>Admin Access</h1>
      <p>Enter your access code to manage wallets</p>
      <input type="password" id="adminPass" placeholder="Admin Password">
      <button onclick="login()">Unlock Dashboard</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashView" class="hidden">
    <div class="top-bar">
      <h1>ChainRecover Control Panel</h1>
      <button class="btn-logout" onclick="logout()">Lock Panel</button>
    </div>
    
    <div class="wrap">
      
      <!-- WITHDRAWALS -->
      <div class="section-title">Pending Withdrawals (Action Required)</div>
      <div class="table-card">
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>User</th><th>Coin</th><th>Amount</th><th>Address</th><th>Action</th></tr></thead>
            <tbody id="withdrawTable"></tbody>
          </table>
        </div>
      </div>

      <!-- USERS -->
      <div class="section-title">Registered Users</div>
      <div class="table-card">
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Manage</th></tr></thead>
            <tbody id="userTable"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <!-- DRAWER (SIDE PANEL) -->
  <div class="drawer-overlay" id="drawer" onclick="closeDrawer(event)">
    <div class="drawer" onclick="event.stopPropagation()">
      <div class="d-head">
        <h2 id="dName">User Details</h2>
        <button class="btn-close" onclick="closeDrawer()">Close</button>
      </div>
      
      <div class="d-body">
        <div class="info-row"><label>Email</label><div class="val" id="dEmail"></div></div>
        <div class="info-row"><label>Wallet Address</label><div class="val mono" id="dWallet"></div></div>
        
        <div class="info-row" style="margin-top: 20px;">
          <label>Account Status</label>
          <span id="dStatusPill" class="pill Active">Active</span>
          <button id="lockBtn" class="btn-lock suspend" onclick="toggleLock()">Suspend Account</button>
        </div>

        <div class="divider"></div>

        <label style="font-size: 0.9rem; font-weight: bold; color: white; margin-bottom: 12px; display: block;">Write Balances (Credit/Debit)</label>
        <div class="bal-grid" id="balGrid">
          <!-- Inputs injected by JS -->
        </div>

        <input type="text" id="adjustNote" placeholder="Reason (e.g., Recovery payout)" style="width:100%; padding:14px; background:#05070e; border:1px solid #1a2a3a; border-radius:10px; color:white; margin-top:16px;">
        <button class="btn-save" onclick="saveBalances()">Save Balances to Wallet</button>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    let allUsers = [];
    let currentUser = null;

    async function login() {
      try {
        const data = await api('/api/admin/login', { method: 'POST', body: { password: document.getElementById('adminPass').value } });
        Tokens.setAdmin(data.token);
        loadDash();
      } catch (err) { alert(err.message); }
    }

    async function loadDash() {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('dashView').classList.remove('hidden');
      loadUsers(); loadWithdrawals();
    }

    async function loadUsers() {
      try {
        const data = await api('/api/admin/users', { auth: 'admin' });
        allUsers = data.users;
        let html = '';
        allUsers.forEach(u => {
          const status = u.locked ? '<span class="pill Suspended">Suspended</span>' : '<span class="pill Active">Active</span>';
          html += `<tr>
            <td><b>${u.name}</b></td>
            <td>${u.email}</td>
            <td>${status}</td>
            <td><button class="btn-manage" onclick="openDrawer(${u.id})">Manage / Edit</button></td>
          </tr>`;
        });
        if(allUsers.length === 0) html = '<tr><td colspan="4" style="text-align:center;">No users yet.</td></tr>';
        document.getElementById('userTable').innerHTML = html;
      } catch (err) { alert('Session expired'); logout(); }
    }

    async function loadWithdrawals() {
      try {
        const data = await api('/api/admin/withdrawals', { auth: 'admin' });
        let html = '';
        data.withdrawals.forEach(w => {
          // Find user name
          const user = allUsers.find(u => u.id === w.user_id);
          const uname = user ? user.name : 'User #' + w.user_id;
          
          html += `<tr>
            <td><b>${uname}</b></td>
            <td>${w.coin}</td>
            <td><b style="color:#ffc857">${w.amount}</b></td>
            <td style="font-family:monospace; font-size:0.75rem">${w.address.substring(0,10)}...</td>
            <td>
              <button onclick="approveW(${w.id}, true)" style="background:#00e5a0;border:none;padding:6px 10px;border-radius:6px;cursor:pointer;font-weight:bold;">Approve</button>
              <button onclick="approveW(${w.id}, false)" style="background:#ff6b81;color:white;border:none;padding:6px 10px;border-radius:6px;cursor:pointer;font-weight:bold;">Reject</button>
            </td>
          </tr>`;
        });
        if(data.withdrawals.length === 0) html = '<tr><td colspan="5" style="text-align:center; color:#93a1b8;">No pending withdrawals.</td></tr>';
        document.getElementById('withdrawTable').innerHTML = html;
      } catch (err) { }
    }

    async function approveW(id, approve) {
      try {
        await api(`/api/admin/withdrawals/${id}`, { method: 'PATCH', auth: 'admin', body: { approve } });
        alert('Withdrawal ' + (approve ? 'Approved' : 'Rejected'));
        loadWithdrawals(); loadUsers();
      } catch (err) { alert(err.message); }
    }

    // ================= DRAWER LOGIC =================
    function openDrawer(id) {
      currentUser = allUsers.find(u => u.id === id);
      if(!currentUser) return;

      document.getElementById('dName').innerText = currentUser.name;
      document.getElementById('dEmail').innerText = currentUser.email;
      document.getElementById('dWallet').innerText = currentUser.wallet_address;
      
      // Setup Status Toggle
      const pill = document.getElementById('dStatusPill');
      const btn = document.getElementById('lockBtn');
      if (currentUser.locked) {
        pill.className = 'pill Suspended'; pill.innerText = 'Suspended';
        btn.innerText = 'Activate Account'; btn.className = 'btn-lock activate';
      } else {
        pill.className = 'pill Active'; pill.innerText = 'Active';
        btn.innerText = 'Suspend Account'; btn.className = 'btn-lock suspend';
      }

      // Setup Balance Inputs
      const coins = ['BNB','BTC','ETH','MATIC','ECE','USDT','USDC','SOL','TRX'];
      let bHtml = '';
      coins.forEach(c => {
        bHtml += `<div class="bal-box"><span>${c}</span><input type="number" id="bal_${c}" value="${currentUser.balances[c] || 0}" step="any"></div>`;
      });
      document.getElementById('balGrid').innerHTML = bHtml;

      document.getElementById('drawer').classList.add('open');
    }

    function closeDrawer(e) {
      if (e && e.target !== document.getElementById('drawer')) return;
      document.getElementById('drawer').classList.remove('open');
    }

    async function toggleLock() {
      const isLocking = !currentUser.locked;
      let reason = "";
      if (isLocking) {
        reason = prompt("Reason for suspension (required):");
        if (reason === null) return; // User clicked cancel
      }

      try {
        await api(`/api/admin/users/${currentUser.id}/lock`, { 
          method: 'PATCH', auth: 'admin', body: { locked: isLocking, reason } 
        });
        loadUsers(); 
        closeDrawer();
      } catch (err) { alert(err.message); }
    }

    async function saveBalances() {
      const coins = ['BNB','BTC','ETH','MATIC','ECE','USDT','USDC','SOL','TRX'];
      const newBals = {};
      coins.forEach(c => {
        newBals[c] = parseFloat(document.getElementById(`bal_${c}`).value) || 0;
      });

      const note = document.getElementById('adjustNote').value;

      try {
        await api(`/api/admin/users/${currentUser.id}/balances`, { 
          method: 'PATCH', auth: 'admin', body: { balances: newBals, note } 
        });
        alert('Wallet balances updated successfully!'); 
        loadUsers(); 
        closeDrawer();
      } catch (err) { alert(err.message); }
    }

    function logout() { 
      Tokens.clearAdmin(); 
      location.reload(); 
    }

    if (Tokens.getAdmin()) loadDash();
  </script>
</body>
</html>
