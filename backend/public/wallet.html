<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Wallet</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { 
    background: #05070e; 
    color: #e9eefb; 
    font-family: system-ui, -apple-system, sans-serif; 
    margin: 0; 
    padding: 20px; 
    min-height: 100vh;
  }
  .card { 
    background: #0b1322; 
    padding: 25px; 
    border-radius: 15px; 
    max-width: 450px; 
    margin: 40px auto; 
    border: 1px solid #1a2a3a; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
  }
  h2 { margin-top: 0; margin-bottom: 20px; font-weight: 600; }
  input { 
    width: 100%; 
    padding: 14px; 
    margin: 8px 0 16px; 
    background: #05070e; 
    border: 1px solid #2a3a4a; 
    color: white; 
    border-radius: 8px; 
    outline: none;
  }
  input:focus { border-color: #00e5a0; }
  button { 
    width: 100%; 
    padding: 14px; 
    background: #00e5a0; 
    color: #03130d; 
    border: none; 
    border-radius: 8px; 
    font-weight: 700; 
    font-size: 15px;
    cursor: pointer; 
    transition: 0.2s; 
  }
  button:hover { background: #00c98c; }
  .hidden { display: none !important; }
  
  /* Dashboard Styles */
  .total-box { 
    text-align: center; 
    margin-bottom: 25px; 
    background: rgba(0, 229, 160, 0.08); 
    padding: 20px; 
    border-radius: 12px; 
    border: 1px solid rgba(0, 229, 160, 0.2); 
  }
  .total-label { 
    color: #93a1b8; 
    font-size: 12px; 
    text-transform: uppercase; 
    letter-spacing: 1.5px; 
    font-weight: 600;
  }
  .total-value { 
    font-size: 36px; 
    font-weight: 800; 
    color: #00e5a0; 
    margin-top: 8px; 
    letter-spacing: -1px;
  }
  .address-box { 
    background: #05070e; 
    padding: 15px; 
    border-radius: 10px; 
    border: 1px solid #1a2a3a; 
    margin-bottom: 25px; 
  }
  .coin-row { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    padding: 15px 0; 
    border-bottom: 1px solid #1a2a3a; 
  }
  .coin-row:last-child { border-bottom: none; }
  .coin-name { font-weight: 700; font-size: 16px; }
  .coin-balance { text-align: right; }
  .coin-amount { font-size: 16px; font-weight: 600; }
  .coin-usd { font-size: 13px; color: #93a1b8; margin-top: 4px; }
</style>
</head>
<body>

  <!-- LOGIN VIEW -->
  <div id="loginView" class="card">
    <h2>Sign In</h2>
    <input type="email" id="loginEmail" placeholder="Email Address">
    <input type="password" id="loginPass" placeholder="Password">
    <button onclick="login()" id="loginBtn">Sign In</button>
    <p style="text-align:center; font-size:13px; color:#93a1b8; cursor:pointer; margin-top:20px;" onclick="show('registerView')">Don't have an account? <b style="color:#00e5a0;">Register</b></p>
  </div>

  <!-- REGISTER VIEW -->
  <div id="registerView" class="card hidden">
    <h2>Create Account</h2>
    <input type="text" id="regName" placeholder="Full Name">
    <input type="email" id="regEmail" placeholder="Email Address">
    <input type="password" id="regPass" placeholder="Password (8+ characters)">
    <input type="text" id="regCountry" placeholder="Country">
    <input type="text" id="regPhone" placeholder="Phone Number">
    <input type="text" id="regAddress" placeholder="Residential Address">
    <button onclick="register()">Create Account</button>
    <p style="text-align:center; font-size:13px; color:#93a1b8; cursor:pointer; margin-top:20px;" onclick="show('loginView')">Already have an account? <b style="color:#00e5a0;">Sign In</b></p>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashView" class="card hidden">
    <h2>My Wallet</h2>
    
    <!-- TOTAL PORTFOLIO -->
    <div class="total-box">
      <div class="total-label">Total Portfolio Value</div>
      <div class="total-value" id="totalUsdValue">$0.00</div>
    </div>

    <!-- WALLET ADDRESS -->
    <div class="address-box">
      <small style="color:#93a1b8; font-weight:600;">Wallet Address</small>
      <div id="walletAddress" style="font-family:monospace; font-size:13px; color:#00e5a0; word-break:break-all; margin-top:8px;"></div>
    </div>
    
    <!-- ASSETS LIST -->
    <h3 style="margin-bottom:10px; font-size: 15px; color: #93a1b8; text-transform: uppercase; letter-spacing: 1px;">Assets</h3>
    <div id="balanceList"></div>
    
    <button onclick="logout()" style="background:#ff6b81; color:white; margin-top:30px;">Sign Out</button>
  </div>

  <script>
    // --- 1. LIVE PRICES MAPPING ---
    // We map your database coin names to CoinGecko's official IDs
    const coinGeckoIds = {
        BNB: 'binancecoin',
        BTC: 'bitcoin',
        ETH: 'ethereum',
        MATIC: 'matic-network',
        ECE: 'ece', // Note: If CoinGecko doesn't have 'ece', it will just show $0.00
        USDT: 'tether',
        USDC: 'usd-coin',
        SOL: 'solana',
        TRX: 'tron'
    };

    let livePrices = {}; // Stores the current prices

    // --- 2. UI NAVIGATION ---
    function show(id) {
      ['loginView','registerView','dashView'].forEach(v => document.getElementById(v).classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    // --- 3. FETCH REAL-TIME PRICES FROM COINGECKO ---
    async function fetchLivePrices() {
        const ids = Object.values(coinGeckoIds).join(',');
        const url = `https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd`;
        
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error('API Limit Reached or Network Error');
            const data = await res.json();
            
            for (const [symbol, cgId] of Object.entries(coinGeckoIds)) {
                if (data[cgId] && data[cgId].usd) {
                    livePrices[symbol] = data[cgId].usd;
                } else {
                    livePrices[symbol] = 0; // Fallback
                }
            }
        } catch (err) {
            console.error("Price fetch error:", err);
            // If the API fails, set all to 0 so the UI doesn't break
            for (const symbol of Object.keys(coinGeckoIds)) {
                livePrices[symbol] = 0; 
            }
        }
    }

    // --- 4. LOGIN LOGIC ---
    async function login() {
      const btn = document.getElementById('loginBtn');
      btn.innerText = "Signing in...";
      btn.disabled = true;

      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPass').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: pass })
        });
        
        const data = await res.json();
        if(!res.ok) throw new Error(data.error || 'Login failed');
        
        localStorage.setItem('cr_token', data.token);
        loadDashboard(); 
      } catch (err) { 
        alert("❌ LOGIN FAILED: " + err.message); 
        btn.innerText = "Sign In";
        btn.disabled = false;
      }
    }

    // --- 5. DASHBOARD LOGIC (Wiring DB to API) ---
    async function loadDashboard() {
      try {
        const token = localStorage.getItem('cr_token');
        if(!token) throw new Error("No token found. Please log in.");

        // Fetch prices first
        await fetchLivePrices();

        // Fetch user data from your backend
        const res = await fetch('/api/wallet', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        
        const data = await res.json();
        if(!res.ok) throw new Error(data.error || 'Failed to load wallet');

        document.getElementById('walletAddress').innerText = data.walletAddress;
        
        let balHtml = '';
        let totalPortfolioUsd = 0;

        // Loop through user balances and calculate totals
        for (const [coin, amount] of Object.entries(data.balances)) {
          const price = livePrices[coin] || 0; 
          const usdValue = amount * price;
          totalPortfolioUsd += usdValue;

          // Formatting the numbers to look professional
          const formattedUsd = usdValue.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
          const formattedAmount = amount.toFixed(4);

          balHtml += `
            <div class="coin-row">
              <div class="coin-name">${coin}</div> 
              <div class="coin-balance">
                <div class="coin-amount">${formattedAmount}</div>
                <div class="coin-usd">${formattedUsd}</div>
              </div>
            </div>`;
        }
        
        // Update the UI
        const formattedTotal = totalPortfolioUsd.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
        document.getElementById('totalUsdValue').innerText = formattedTotal;
        document.getElementById('balanceList').innerHTML = balHtml || '<p style="color:#aaa;">No balances yet</p>';
        
        show('dashView');
      } catch (err) {
        alert("❌ DASHBOARD ERROR: " + err.message);
        logout();
      }
    }

    // --- 6. REGISTER LOGIC ---
    async function register() {
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('regName').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPass').value,
            country: document.getElementById('regCountry').value,
            phone: document.getElementById('regPhone').value,
            address: document.getElementById('regAddress').value
          })
        });
        const data = await res.json();
        if(!res.ok) throw new Error(data.error || 'Registration failed');
        
        alert("Account created! Please log in.");
        show('loginView');
      } catch (err) { alert("❌ REGISTER FAILED: " + err.message); }
    }

    // --- 7. LOGOUT LOGIC ---
    function logout() { 
        localStorage.removeItem('cr_token'); 
        show('loginView'); 
        document.getElementById('loginBtn').innerText = "Sign In";
        document.getElementById('loginBtn').disabled = false;
    }
    
    // --- 8. INITIALIZATION ---
    // Check if user is already logged in when they open the page
    if (localStorage.getItem('cr_token')) {
        loadDashboard();
    } else {
        show('loginView');
    }
  </script>
</body>
</html>
