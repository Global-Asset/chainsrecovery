<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Wallet</title>
<style>
  body { background: #05070e; color: #e9eefb; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; }
  .card { background: #0b1322; padding: 25px; border-radius: 15px; max-width: 450px; margin: 40px auto; border: 1px solid #1a2a3a; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  input { width: 100%; padding: 12px; margin: 8px 0 16px; background: #05070e; border: 1px solid #2a3a4a; color: white; border-radius: 8px; box-sizing: border-box; }
  button { width: 100%; padding: 12px; background: #00e5a0; color: #03130d; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
  button:hover { background: #00c98c; }
  .hidden { display: none; }
  .total-box { text-align: center; margin-bottom: 25px; background: rgba(0, 229, 160, 0.1); padding: 15px; border-radius: 10px; border: 1px solid rgba(0, 229, 160, 0.3); }
  .total-label { color: #93a1b8; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
  .total-value { font-size: 32px; font-weight: 800; color: #00e5a0; margin-top: 5px; }
  .coin-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #1a2a3a; }
  .coin-row:last-child { border-bottom: none; }
  .coin-name { font-weight: bold; font-size: 15px; }
  .coin-balance { text-align: right; }
  .coin-amount { font-size: 15px; font-weight: 600; }
  .coin-usd { font-size: 12px; color: #93a1b8; margin-top: 2px; }
</style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginView" class="card">
    <h2>Sign In</h2>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPass" placeholder="Password">
    <button onclick="login()" id="loginBtn">Sign In</button>
    <p style="text-align:center; font-size:12px; color:#aaa; cursor:pointer; margin-top:15px;" onclick="show('registerView')">Register</p>
  </div>

  <!-- REGISTER -->
  <div id="registerView" class="card hidden">
    <h2>Register</h2>
    <input type="text" id="regName" placeholder="Full Name">
    <input type="email" id="regEmail" placeholder="Email">
    <input type="password" id="regPass" placeholder="Password (8+ chars)">
    <input type="text" id="regCountry" placeholder="Country">
    <input type="text" id="regPhone" placeholder="Phone Number">
    <input type="text" id="regAddress" placeholder="Address">
    <button onclick="register()">Create Account</button>
    <p style="text-align:center; font-size:12px; color:#aaa; cursor:pointer; margin-top:15px;" onclick="show('loginView')">Already have an account? Login</p>
  </div>

  <!-- DASHBOARD -->
  <div id="dashView" class="card hidden">
    <h2 style="margin-bottom: 20px;">My Wallet</h2>
    
    <!-- TOTAL USD BALANCE -->
    <div class="total-box">
      <div class="total-label">Total Portfolio Value</div>
      <div class="total-value" id="totalUsdValue">$0.00</div>
    </div>

    <div style="background:#05070e; padding:15px; border-radius:8px; border:1px solid #1a2a3a; margin-bottom:20px;">
      <small style="color:#93a1b8;">Wallet Address</small>
      <div id="walletAddress" style="font-family:monospace; font-size:13px; color:#00e5a0; word-break:break-all; margin-top:5px;"></div>
    </div>
    
    <h3 style="margin-bottom:10px; font-size: 16px; color: #93a1b8;">Assets</h3>
    <div id="balanceList"></div>
    
    <button onclick="logout()" style="background:#ff6b81; color:white; margin-top:25px;">Sign Out</button>
  </div>

  <script>
    // --- 1. PRICE DATA (You can update these later or connect an API) ---
    const prices = { 
        BNB: 580.00, 
        BTC: 67000.00, 
        ETH: 3400.00, 
        MATIC: 0.70, 
        ECE: 1.00, 
        USDT: 1.00, 
        USDC: 1.00, 
        SOL: 145.00, 
        TRX: 0.13 
    };

    function show(id) {
      ['loginView','registerView','dashView'].forEach(v => document.getElementById(v).classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    // --- 2. LOGIN ---
    async function login() {
      const btn = document.getElementById('loginBtn');
      btn.innerText = "Signing in...";
      btn.disabled = true;

      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPass').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: pass })
        });
        
        const data = await res.json();
        if(!res.ok) throw new Error(data.error || 'Login failed');
        
        localStorage.setItem('cr_token', data.token);
        loadDashboard(); 
      } catch (err) { 
        alert("❌ LOGIN FAILED: " + err.message); 
        btn.innerText = "Sign In";
        btn.disabled = false;
      }
    }

    // --- 3. LOAD DASHBOARD & CALCULATE USD ---
    async function loadDashboard() {
      try {
        const token = localStorage.getItem('cr_token');
        if(!token) throw new Error("No token found. Please log in.");

        const res = await fetch('/api/wallet', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        
        const data = await res.json();
        if(!res.ok) throw new Error(data.error || 'Failed to load wallet');

        document.getElementById('walletAddress').innerText = data.walletAddress;
        
        let balHtml = '';
        let totalPortfolioUsd = 0;

        // Loop through balances, calculate USD, and build HTML
        for (const [coin, amount] of Object.entries(data.balances)) {
          const price = prices[coin] || 0; 
          const usdValue = amount * price;
          totalPortfolioUsd += usdValue;

          // Format numbers nicely (e.g. 67,000.00)
          const formattedUsd = usdValue.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
          const formattedAmount = amount.toFixed(4);

          balHtml += `
            <div class="coin-row">
              <div class="coin-name">${coin}</div> 
              <div class="coin-balance">
                <div class="coin-amount">${formattedAmount}</div>
                <div class="coin-usd">${formattedUsd}</div>
              </div>
            </div>`;
        }
        
        // Update UI
        const formattedTotal = totalPortfolioUsd.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
        document.getElementById('totalUsdValue').innerText = formattedTotal;
        
        document.getElementById('balanceList').innerHTML = balHtml || '<p style="color:#aaa;">No balances yet</p>';
        
        show('dashView');
      } catch (err) {
        alert("❌ DASHBOARD ERROR: " + err.message);
        logout();
      }
    }

    // --- 4. REGISTER ---
    async function register() {
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('regName').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPass').value,
            country: document.getElementById('regCountry').value,
            phone: document.getElementById('regPhone').value,
            address: document.getElementById('regAddress').value
          })
        });
        const data = await res.json();
        if(!res.ok) throw new Error(data.error || 'Registration failed');
        
        alert("Account created! Please log in.");
        show('loginView');
      } catch (err) { alert("❌ REGISTER FAILED: " + err.message); }
    }

    // --- 5. LOGOUT ---
    function logout() { 
        localStorage.removeItem('cr_token'); 
        show('loginView'); 
        document.getElementById('loginBtn').innerText = "Sign In";
        document.getElementById('loginBtn').disabled = false;
    }
    
    // Check if already logged in on page load
    if (localStorage.getItem('cr_token')) {
        loadDashboard();
    } else {
        show('loginView');
    }
  </script>
</body>
</html>
